services:
  db:
    container_name: db
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: api
    build: ./api
    image: ghcr.io/<org>/vinyls_addict/api:latest
    restart: always
    env_file:
      - ./api/.env
    environment:
      - DISCOGS_USER_AGENT=${DISCOGS_USER_AGENT:-VinylsAddict/1.0}
      - DISCOGS_TOKEN=${DISCOGS_TOKEN:-}
    command: ["npm", "start"]
    volumes:
      - api_uploads:/api/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:33000/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  app:
    container_name: app
    build:
      context: ./app
      args:
        VITE_BACKEND_URL_DEV: ${VITE_BACKEND_URL_DEV}
    image: ghcr.io/<org>/vinyls_addict/app:latest
    restart: always

  landing:
    container_name: landing
    build:
      context: ./landing
      args:
        PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://partagetacollection.eu}
    image: ghcr.io/<org>/vinyls_addict/landing:latest
    restart: always

  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_started
      landing:
        condition: service_started

volumes:
  db_data:
  api_uploads:
  caddy_data:
  caddy_config:
